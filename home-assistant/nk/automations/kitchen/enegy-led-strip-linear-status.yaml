id: "17359666705612"
alias: Energy Status Linear
mode: "restart"
description: ""
triggers:
  - trigger: state
    entity_id:
      - sensor.inverter_grid_meter_power_mean_10s
  - trigger: state
    entity_id:
      - light.kitchen_strip
  - trigger: state
    entity_id:
      - light.kitchen_strip
    attribute: brightness
  - trigger: state
    entity_id:
      - light.kitchen_strip
    attribute: color_temp
conditions:
  - condition: state
    entity_id: light.dishwasher_main
    state: "on"
actions:
  - variables:
      power_status_threshold_w: 500
      grid_w: >-
        {% set smoothed = states('sensor.inverter_grid_meter_power_mean_10s') %}
        {% if smoothed not in ['unknown', 'unavailable', 'none', ''] %}
          {{ smoothed | float(0) }}
        {% else %}
          {{ states('sensor.inverter_grid_meter_power') | float(0) }}
        {% endif %}
      power_status_active: "{{ (grid_w | float(0) | abs) >= (power_status_threshold_w | float(0)) }}"
      kitchen_on: "{{ is_state('light.kitchen_strip', 'on') }}"
      kitchen_brightness: "{{ state_attr('light.kitchen_strip', 'brightness') | int(26) }}"
      kitchen_ct: "{{ state_attr('light.kitchen_strip', 'color_temp') | int(475) }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ power_status_active }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.dishwasher
          - action: rest_command.wled_set_colors
            data:
              wled_host: 192.168.2.138
              segment: 0
              brightness: 255
              speed: >-
                {% set v = grid_w | float(0) %}
                {% set steps = 5 %}
                {% set min_speed = 64 %}
                {% set max_speed = 148 %}
                {% set range = 2000 %}  {# how much above/below the bounds you want to scale #}

                {% if v < -3000 %}
                  {% set scale = ((-v - 3000) / range) %}
                  {% set val = ([scale * steps, steps - 1] | min) | int %}
                  {{ min_speed + val * ((max_speed - min_speed) / (steps - 1)) | round }}
                {% elif v > 2000 %}
                  {% set scale = ((v - 2000) / range) %}
                  {% set val = ([scale * steps, steps - 1] | min) | int %}
                  {{ min_speed + val * ((max_speed - min_speed) / (steps - 1)) | round }}
                {% else %}
                  {{ min_speed }}
                {% endif %}
              intensity: 128
              effect: 28
              color1: >-
                {% set v = grid_w | float(0) %}
                {% if v < -3000 %}
                  00bb2c
                {% elif v < -500 %}
                  00a2bb
                {% elif v < 0 %}
                  a8a5a5
                {% elif v < 500 %}
                  9da3a5
                {% elif v < 2000 %}
                  c17a00
                {% else %}
                  c11000
                {% endif %}
              color2: >-
                {% set v = grid_w | float(0) %}
                {% if v < -3000 %}
                  00731a
                {% elif v < -500 %}
                  005e6b
                {% elif v < 0 %}
                  5b5a5a
                {% elif v < 500 %}
                  525657
                {% elif v < 2000 %}
                  704400
                {% else %}
                  6e0900
                {% endif %}
              color3: "000000"
              reverse: >-
                {% set v = grid_w | float(0) %}
                {% if v > 0 %}
                0
                {% else %}
                1
                {% endif %}
      - conditions:
          - condition: template
            value_template: "{{ kitchen_on }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.dishwasher
          - action: rest_command.wled_set_colors
            data:
              wled_host: 192.168.2.138
              segment: 0
              brightness: "{{ kitchen_brightness }}"
              speed: 128
              intensity: 128
              effect: 0
              color1: >-
                {% set ct = kitchen_ct | int(475) %}
                {% set min_ct = 200 %}
                {% set max_ct = 500 %}
                {% set t = (ct - min_ct) / (max_ct - min_ct) %}
                {% set t = [0, t] | max %}
                {% set t = [1, t] | min %}
                {% set cool = [255, 224, 180] %}
                {% set warm = [255, 184, 116] %}
                {% set r = (cool[0] + (warm[0] - cool[0]) * t) | round | int %}
                {% set g = (cool[1] + (warm[1] - cool[1]) * t) | round | int %}
                {% set b = (cool[2] + (warm[2] - cool[2]) * t) | round | int %}
                {{ "%02x%02x%02x" | format(r, g, b) }}
              color2: >-
                {% set ct = kitchen_ct | int(475) %}
                {% set min_ct = 200 %}
                {% set max_ct = 500 %}
                {% set t = (ct - min_ct) / (max_ct - min_ct) %}
                {% set t = [0, t] | max %}
                {% set t = [1, t] | min %}
                {% set cool = [140, 116, 88] %}
                {% set warm = [111, 76, 48] %}
                {% set r = (cool[0] + (warm[0] - cool[0]) * t) | round | int %}
                {% set g = (cool[1] + (warm[1] - cool[1]) * t) | round | int %}
                {% set b = (cool[2] + (warm[2] - cool[2]) * t) | round | int %}
                {{ "%02x%02x%02x" | format(r, g, b) }}
              color3: "000000"
              reverse: 0
    default:
      - action: light.turn_off
        target:
          entity_id: light.dishwasher
