esphome:
  name: "kitchen-stat-display"
  friendly_name: "Kitchen Stat Display"
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_battery_ui
      - script.execute: refresh_solar_ui
      - script.execute: refresh_grid_ui
      - script.execute: refresh_cost_ui
      - script.execute: compute_flow_mode
      - script.execute: refresh_flow_ring

esp32:
  board: esp32dev

psram:
  mode: quad
  speed: 80MHz

logger:

globals:
  - id: flow_ring_phase
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_ring_mode
    type: int
    restore_value: no
    initial_value: '0'
  - id: flow_ring_mode_prev
    type: int
    restore_value: no
    initial_value: '-1'
  - id: flow_segment_visible
    type: int
    restore_value: no
    initial_value: '0'
  - id: flow_seg_start
    type: int
    restore_value: no
    initial_value: '0'
  - id: flow_seg_end
    type: int
    restore_value: no
    initial_value: '0'

api:
  encryption:
    key: !secret kitchen_stat_display_api_encryption_key

ota:
  - platform: esphome
    password: !secret kitchen_stat_display_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Touchscreen-Demo"
    password: !secret wifi_fallback_password

captive_portal:

time:
  - platform: homeassistant
    timezone: "Australia/Melbourne"
    id: esptime

web_server:

spi:
  mosi_pin: GPIO15
  clk_pin: GPIO14

i2c:
  sda: GPIO21
  scl: GPIO22

output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bottom Button"
    on_press:
      then:
        - light.toggle:
            id: back_light

display:
  - platform: ili9xxx
    model: gc9a01a
    id: round_disp
    cs_pin: GPIO5
    dc_pin: GPIO27
    reset_pin: GPIO33
    rotation: 0
    invert_colors: true
    color_palette: 8BIT
    auto_clear_enabled: false
    update_interval: never

script:
  - id: compute_flow_mode
    mode: restart
    then:
      - lambda: |-
          const float batt_thr = 0.08f;
          const float grid_imp_thr = 0.12f;
          const float pv_active_thr = 0.10f;
          const float pv_surplus_thr = 0.05f;

          float batt_kw = id(ha_inverter_battery_power).state;
          float grid_kw = id(ha_inverter_meter_power).state;
          float pv_kw_raw = id(ha_inverter_total_active_power).state;
          float load_kw_raw = id(ha_inverter_load_power).state;

          float pv_kw = isnan(pv_kw_raw) ? 0.0f : fmaxf(0.0f, pv_kw_raw);
          float load_kw = isnan(load_kw_raw) ? 0.0f : fmaxf(0.0f, load_kw_raw);
          float grid_import_kw = isnan(grid_kw) ? 0.0f : fmaxf(0.0f, -grid_kw);
          float pv_surplus_kw = pv_kw - load_kw;

          int mode = 0;
          if (isnan(batt_kw) || fabsf(batt_kw) <= batt_thr) {
            mode = 0;
          } else if (batt_kw > batt_thr) {
            mode = 3;
          } else {
            // batt < -batt_thr => charging
            if (grid_import_kw > grid_imp_thr && pv_surplus_kw < pv_surplus_thr) {
              mode = 2;
            } else if (pv_kw > pv_active_thr) {
              mode = 1;
            } else {
              mode = 2;
            }
          }

          id(flow_ring_mode) = mode;

          if (mode != id(flow_ring_mode_prev)) {
            id(flow_ring_phase) = 0.0f;
            id(flow_ring_mode_prev) = mode;
          }
      - script.execute: refresh_flow_subtitle

  - id: refresh_battery_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: label_battery_soc
          text: !lambda |-
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) {
              return std::string("--%");
            }
            soc = fmaxf(0.0f, fminf(100.0f, soc));
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", soc);
            return std::string(buf);
      - lvgl.indicator.update:
          id: indicator_soc_green
          end_value: !lambda |-
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) {
              return 0;
            }
            soc = fmaxf(0.0f, fminf(100.0f, soc));
            return (int)(soc + 0.5f);
      - lvgl.indicator.update:
          id: indicator_soc_yellow
          end_value: !lambda |-
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) {
              return 0;
            }
            soc = fmaxf(0.0f, fminf(100.0f, soc));
            return (int)(soc + 0.5f);
      - lvgl.indicator.update:
          id: indicator_soc_red
          end_value: !lambda |-
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) {
              return 0;
            }
            soc = fmaxf(0.0f, fminf(100.0f, soc));
            return (int)(soc + 0.5f);
      - if:
          condition:
            lambda: |-
              float soc = id(ha_inverter_battery_soc).state;
              return isnan(soc);
          then:
            - lvgl.indicator.update:
                id: indicator_soc_green
                opa: 0%
            - lvgl.indicator.update:
                id: indicator_soc_yellow
                opa: 0%
            - lvgl.indicator.update:
                id: indicator_soc_red
                opa: 0%
          else:
            - if:
                condition:
                  lambda: |-
                    float soc = id(ha_inverter_battery_soc).state;
                    return soc >= 60.0f;
                then:
                  - lvgl.indicator.update:
                      id: indicator_soc_green
                      opa: 100%
                  - lvgl.indicator.update:
                      id: indicator_soc_yellow
                      opa: 0%
                  - lvgl.indicator.update:
                      id: indicator_soc_red
                      opa: 0%
                else:
                  - if:
                      condition:
                        lambda: |-
                          float soc = id(ha_inverter_battery_soc).state;
                          return soc >= 30.0f;
                      then:
                        - lvgl.indicator.update:
                            id: indicator_soc_green
                            opa: 0%
                        - lvgl.indicator.update:
                            id: indicator_soc_yellow
                            opa: 100%
                        - lvgl.indicator.update:
                            id: indicator_soc_red
                            opa: 0%
                      else:
                        - lvgl.indicator.update:
                            id: indicator_soc_green
                            opa: 0%
                        - lvgl.indicator.update:
                            id: indicator_soc_yellow
                            opa: 0%
                        - lvgl.indicator.update:
                            id: indicator_soc_red
                            opa: 100%

  - id: refresh_solar_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: label_solar_value
          text: !lambda |-
            float solar_kw = id(ha_inverter_total_active_power).state;
            if (isnan(solar_kw)) {
              return std::string("--W");
            }
            solar_kw = fmaxf(solar_kw, 0.0f);
            char buf[16];
            if (solar_kw >= 1.0f) {
              snprintf(buf, sizeof(buf), "%.1fkW", solar_kw);
            } else {
              snprintf(buf, sizeof(buf), "%.0fW", solar_kw * 1000.0f);
            }
            return std::string(buf);

  - id: refresh_grid_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: label_grid_value
          text: !lambda |-
            float grid_kw = id(ha_inverter_meter_power).state;
            if (isnan(grid_kw)) {
              return std::string("--W");
            }
            if (fabsf(grid_kw) < 0.025f) {
              grid_kw = 0.0f;
            }
            char buf[16];
            if (fabsf(grid_kw) >= 1.0f) {
              snprintf(buf, sizeof(buf), "%.1fkW", grid_kw);
            } else {
              snprintf(buf, sizeof(buf), "%.0fW", grid_kw * 1000.0f);
            }
            return std::string(buf);

  - id: refresh_cost_ui
    mode: restart
    then:
      - lvgl.label.update:
          id: label_daily_cost
          text: !lambda |-
            float cost = id(ha_daily_cost).state;
            if (isnan(cost)) {
              return std::string("$--");
            }
            char buf[16];
            snprintf(buf, sizeof(buf), "$%.2f", cost);
            return std::string(buf);

  - id: refresh_flow_ring
    mode: restart
    then:
      - lvgl.indicator.update:
          id: indicator_flow_seg_green
          start_value: !lambda "return id(flow_seg_start);"
          end_value: !lambda "return id(flow_seg_end);"
          opa: !lambda |-
            if (!id(flow_segment_visible)) return 0;
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) return 0;
            return soc >= 60.0f ? 255 : 0;
      - lvgl.indicator.update:
          id: indicator_flow_seg_yellow
          start_value: !lambda "return id(flow_seg_start);"
          end_value: !lambda "return id(flow_seg_end);"
          opa: !lambda |-
            if (!id(flow_segment_visible)) return 0;
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) return 0;
            return (soc >= 30.0f && soc < 60.0f) ? 255 : 0;
      - lvgl.indicator.update:
          id: indicator_flow_seg_red
          start_value: !lambda "return id(flow_seg_start);"
          end_value: !lambda "return id(flow_seg_end);"
          opa: !lambda |-
            if (!id(flow_segment_visible)) return 0;
            float soc = id(ha_inverter_battery_soc).state;
            if (isnan(soc)) return 0;
            return soc < 30.0f ? 255 : 0;

  - id: refresh_flow_subtitle
    mode: restart
    then:
      - lvgl.label.update:
          id: label_flow_state
          text: !lambda |-
            if (id(flow_ring_mode) == 1) return std::string("CHARGING FROM SOLAR");
            if (id(flow_ring_mode) == 2) return std::string("CHARGING FROM GRID");
            if (id(flow_ring_mode) == 3) return std::string("DISCHARGING");
            return std::string("");
      - if:
          condition:
            lambda: 'return id(flow_ring_mode) == 1;'
          then:
            - lvgl.label.update:
                id: label_flow_state
                text_color: 0xFFB300
          else:
            - if:
                condition:
                  lambda: 'return id(flow_ring_mode) == 2;'
                then:
                  - lvgl.label.update:
                      id: label_flow_state
                      text_color: 0x6EC6FF
                else:
                  - lvgl.label.update:
                      id: label_flow_state
                      text_color: 0xFFFFFF

sensor:
  - platform: homeassistant
    id: ha_inverter_battery_soc
    entity_id: sensor.foxess_inverter_battery_soc_1
    on_value:
      then:
        - script.execute: refresh_battery_ui

  - platform: homeassistant
    id: ha_inverter_total_active_power
    entity_id: sensor.foxess_inverter_ct2_meter
    on_value:
      then:
        - script.execute: refresh_solar_ui

  - platform: homeassistant
    id: ha_inverter_meter_power
    entity_id: sensor.foxess_inverter_grid_ct
    on_value:
      then:
        - script.execute: refresh_grid_ui

  - platform: homeassistant
    id: ha_inverter_battery_power
    entity_id: sensor.foxess_inverter_invbatpower_1

  - platform: homeassistant
    id: ha_inverter_load_power
    entity_id: sensor.foxess_inverter_load_power

  - platform: homeassistant
    id: ha_daily_cost
    entity_id: sensor.mains_energy_consumed_daily_cost
    on_value:
      then:
        - script.execute: refresh_cost_ui

interval:
  - interval: 500ms
    then:
      - script.execute: compute_flow_mode

  - interval: 80ms
    then:
      - lambda: |-
          const float segment_len = 14.0f;
          int mode = id(flow_ring_mode);
          float soc = id(ha_inverter_battery_soc).state;

          if (isnan(soc)) soc = 0.0f;
          soc = fmaxf(0.0f, fminf(100.0f, soc));

          if (mode == 0 || soc < 6.0f) {
            id(flow_segment_visible) = 0;
            id(flow_seg_start) = 0;
            id(flow_seg_end) = 0;
            return;
          }

          id(flow_segment_visible) = 1;
          id(flow_ring_phase) += 0.046f;
          if (id(flow_ring_phase) >= 1.0f) {
            id(flow_ring_phase) -= 1.0f;
          }

          float head = (mode == 3)
            ? (soc * (1.0f - id(flow_ring_phase)))
            : (soc * id(flow_ring_phase));

          float seg_s = head - segment_len;
          float seg_e = head;

          seg_s = fmaxf(0.0f, fminf(soc, seg_s));
          seg_e = fmaxf(0.0f, fminf(soc, seg_e));

          float active_len = fmaxf(seg_e - seg_s, 0.0f);
          if (active_len < 0.5f) {
            id(flow_segment_visible) = 0;
            id(flow_seg_start) = 0;
            id(flow_seg_end) = 0;
            return;
          }

          id(flow_seg_start) = (int)fmaxf(0.0f, fminf(100.0f, seg_s));
          id(flow_seg_end) = (int)fmaxf(0.0f, fminf(100.0f, seg_e));
      - script.execute: refresh_flow_ring

touchscreen:
  id: touch
  platform: cst816
  interrupt_pin: GPIO19

lvgl:
  bg_color: 0
  border_width: 0
  outline_width: 0
  text_font: MONTSERRAT_16
  align: center
  style_definitions:
    - id: soc_style
      text_font: MONTSERRAT_48
      align: center
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      pad_all: 0
    - id: metric_key_style
      text_font: MONTSERRAT_20
      align: center
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      pad_all: 0
    - id: metric_value_style
      text_font: MONTSERRAT_20
      align: center
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      pad_all: 0
    - id: flow_state_style
      text_font: MONTSERRAT_12
      align: center
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      pad_all: 0
    - id: cost_style
      text_font: MONTSERRAT_20
      align: center
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      border_width: 0
      outline_width: 0
      pad_all: 0
  page_wrap: true
  pages:
    - id: main_page
      widgets:
        - obj:
            width: 240
            height: 240
            radius: 120
            clip_corner: true
            align: center
            bg_color: 0
            bg_opa: COVER
            border_width: 0
            outline_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  width: 152
                  height: 1
                  align: center
                  y: -10
                  bg_color: 0x2B2B2B
                  bg_opa: COVER
                  border_width: 0
                  outline_width: 0
                  pad_all: 0

              - obj:
                  width: 152
                  height: 1
                  align: center
                  y: 66
                  bg_color: 0x2B2B2B
                  bg_opa: COVER
                  border_width: 0
                  outline_width: 0
                  pad_all: 0

              - meter:
                  width: 100%
                  height: 100%
                  align: center
                  bg_opa: TRANSP
                  border_width: 0
                  outline_width: 0
                  pad_all: 0
                  scales:
                    rotation: 270
                    angle_range: 360
                    range_from: 0
                    range_to: 100
                    ticks:
                      count: 0
                    indicators:
                      - arc:
                          id: indicator_soc_track
                          color: 0x1C1C1C
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 100
                      - arc:
                          id: indicator_soc_green
                          color: 0x18C617
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 0
                          opa: 0%
                      - arc:
                          id: indicator_soc_yellow
                          color: 0xFFD400
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 0
                          opa: 0%
                      - arc:
                          id: indicator_soc_red
                          color: 0xFF3B30
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 0
                          opa: 0%
                      - arc:
                          id: indicator_flow_seg_green
                          color: 0x64EF63
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 0
                          opa: 0%
                      - arc:
                          id: indicator_flow_seg_yellow
                          color: 0xFFEB73
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 0
                          opa: 0%
                      - arc:
                          id: indicator_flow_seg_red
                          color: 0xFF7A74
                          width: 5
                          r_mod: -2
                          start_value: 0
                          end_value: 0
                          opa: 0%

              - obj:
                  width: 14
                  height: 14
                  radius: 7
                  align: center
                  bg_color: 0
                  bg_opa: COVER
                  border_width: 0
                  outline_width: 0
                  pad_all: 0

              - label:
                  id: label_battery_soc
                  styles: soc_style
                  text: "--%"
                  align: center
                  y: -54

              - label:
                  id: label_flow_state
                  styles: flow_state_style
                  text: ""
                  text_color: 0xFFFFFF
                  align: center
                  y: -24

              - label:
                  id: label_solar_key
                  styles: metric_key_style
                  text: "SOLAR"
                  text_color: 0xFFD400
                  align: center
                  x: -36
                  y: 18

              - label:
                  id: label_solar_value
                  styles: metric_value_style
                  text: "--W"
                  text_color: 0xFFFFFF
                  align: center
                  x: 46
                  y: 18

              - label:
                  id: label_grid_key
                  styles: metric_key_style
                  text: "GRID"
                  text_color: 0x6EC6FF
                  align: center
                  x: -42
                  y: 44

              - label:
                  id: label_grid_value
                  styles: metric_value_style
                  text: "--W"
                  text_color: 0xFFFFFF
                  align: center
                  x: 46
                  y: 44

              - label:
                  id: label_daily_cost
                  styles: cost_style
                  text: "$--"
                  align: center
                  y: 84
