template:
  - binary_sensor:
      - name: "Lightning Strike Last Hour"
        unique_id: lightning_strike_last_hour
        availability: >
          {{ has_value('sensor.ecowitt_hub_last_lightning_strike') }}
        state: >
          {% set last = states('sensor.ecowitt_hub_last_lightning_strike')
            | as_datetime(default=none) %}
          {% set age = (now() - (last | as_local)).total_seconds()
            if last is not none else none %}
          {{ age is not none and 0 <= age < 3600 }}
