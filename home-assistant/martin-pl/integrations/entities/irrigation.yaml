template:
  - sensor:
      - name: "Front Herbs time remaining friendly"
        state: |
          {% set remaining = states('sensor.front_herbs_time_remaining')|float(0) %}
          {% if remaining > 0 %}
          {{- '%02d' % (remaining / 60)|int -}}:
          {{- '%02d' % (remaining % 60)|int }} remaining
          {% endif %}
      - name: "Front Lawn time remaining friendly"
