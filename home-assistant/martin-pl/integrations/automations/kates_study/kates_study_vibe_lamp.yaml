template:
  - binary_sensor:
      - name: Kates Study Motion Recent 10m
        unique_id: kates_study_motion_recent_10m
        device_class: occupancy
        state: >-
          {{ is_state('binary_sensor.spare_room_motion_occupancy', 'on') }}
        delay_off: "00:10:00"

      - name: Kates Study Desk Power High
        unique_id: kates_study_desk_power_high
        state: >-
          {{ states('sensor.kates_desk_current_consumption') | float(0) > 50 }}

automation:
  - id: "kates_study_vibe_lamp_activity_control"
    alias: "kates study: control vibe lamp from motion + desk power"
    description: ""
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.spare_room_motion_occupancy
        to: "on"
        id: motion_on

      - trigger: state
        entity_id:
          - binary_sensor.kates_study_desk_power_high
        to: "on"
        id: power_high_on

      - trigger: template
        value_template: >-
          {{
            is_state('binary_sensor.spare_room_motion_occupancy', 'off')
            and is_state('binary_sensor.kates_study_desk_power_high', 'off')
          }}
        for:
          hours: 0
          minutes: 30
          seconds: 0
        id: idle_30m

    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - motion_on
              - condition: state
                entity_id: binary_sensor.kates_study_desk_power_high
                state: "on"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.kates_vibe_lamp

          - conditions:
              - condition: trigger
                id:
                  - power_high_on
              - condition: state
                entity_id: binary_sensor.kates_study_motion_recent_10m
                state: "on"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.kates_vibe_lamp

          - conditions:
              - condition: trigger
                id:
                  - idle_30m
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.kates_vibe_lamp
