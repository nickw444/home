esphome:
  name: "kitchen-stat"
  friendly_name: Kitchen Stat

esp32:
  board: esp32dev

psram:
  mode: quad
  speed: 80MHz

logger:

globals:
  - id: flow_phase
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_pv_house
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_pv_battery
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_pv_grid
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_batt_house
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_batt_grid
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_grid_house
    type: float
    restore_value: no
    initial_value: '0'
  - id: flow_grid_battery
    type: float
    restore_value: no
    initial_value: '0'

api:
  encryption:
    key: !secret screen_spare_api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Touchscreen-Demo"
    password: !secret wifi_fallback_password

captive_portal:

spi:
  mosi_pin: GPIO15
  clk_pin: GPIO14

i2c:
  sda: GPIO21
  scl: GPIO22

output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bottom Button"
    on_press: 
      then:
        - light.toggle:
            id: back_light

display:
  - platform: ili9xxx
    model: gc9a01a
    id: round_disp
    cs_pin: GPIO5
    dc_pin: GPIO27
    reset_pin: GPIO33
    rotation: 0
    invert_colors: true
    color_palette: 8BIT
    auto_clear_enabled: false
    update_interval: never

sensor:
    - platform: homeassistant
      id: ha_inverter_meter_power
      entity_id: sensor.inverter_meter_power
      on_value:
        then:
          - lvgl.image.update:
              id: img_inverter_meter_power
              src: !lambda "return x >= 0 ? id(mdi_home_import_outline) : id(mdi_home_export_outline);"
          - if:
              condition:
                lambda: 'return fabsf(x) > 1000;'
              then:
                - lvgl.label.update:
                    id: label_inverter_meter_power
                    text:
                      format: "%.1f"  
                      args: ['x/1000']
              else:
                - lvgl.label.update:
                    id: label_inverter_meter_power
                    text:
                      format: "%.0f"  
                      args: ['(fabsf(x) < 0.5f) ? 0 : x']
          - lvgl.label.update:
              id: label_inverter_meter_power_unit
              text: !lambda |-
                return std::string(fabsf(x) > 1000.0f ? "kW" : "W");
          - lvgl.label.update:
              id: label_grid_price
              text: !lambda |-
                float buy = id(ha_amber_general_price).state;
                if (isnan(buy)) buy = id(ha_amber_general_price_non_estimate).state;
                float sell = id(ha_amber_feed_in_price).state;
                if (isnan(sell)) sell = id(ha_amber_feed_in_price_non_estimate).state;
                float price = x >= 0 ? buy : sell;
                if (isnan(price)) {
                  return std::string("--");
                }
                char buf[24];
                if (fabsf(price) < 1.0f) {
                  snprintf(buf, sizeof(buf), "%.0fc/", price * 100.0f);
                } else {
                  snprintf(buf, sizeof(buf), "%.2f$/", price);
                }
                return std::string(buf);
    - platform: homeassistant
      id: ha_inverter_total_active_power
      entity_id: sensor.inverter_total_active_power
      on_value:
        then:
          - if:
              condition:
                lambda: 'return fabsf(x) > 1000;'
