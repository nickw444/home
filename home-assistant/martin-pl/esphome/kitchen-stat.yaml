interval:
  - interval: 150ms
    then:
      - lambda: |-
          id(flow_phase) += 0.06f;
          if (id(flow_phase) > 1.0f) {
            id(flow_phase) -= 1.0f;
          }
      - lambda: |-
          // Allocate source->sink flows so simultaneous paths can be shown together.
          float pv = fmaxf(id(ha_inverter_total_active_power).state, 0.0f);
          float load = fmaxf(id(ha_inverter_load_power).state, 0.0f);
          float batt = id(ha_inverter_battery_power).state;
          float grid = id(ha_inverter_meter_power).state;

          float batt_dis = fmaxf(batt, 0.0f);
          float batt_chg = fmaxf(-batt, 0.0f);
          float grid_import = fmaxf(grid, 0.0f);
          float grid_export = fmaxf(-grid, 0.0f);

          // Supply house load priority: PV, then battery, then grid.
          float pv_to_house = fminf(pv, load);
          float load_remaining = fmaxf(load - pv_to_house, 0.0f);

          float batt_to_house = fminf(batt_dis, load_remaining);
          load_remaining = fmaxf(load_remaining - batt_to_house, 0.0f);

          float grid_to_house = fminf(grid_import, load_remaining);
          float grid_import_remaining = fmaxf(grid_import - grid_to_house, 0.0f);

          // Charge battery from remaining PV, then remaining grid import.
          float pv_remaining = fmaxf(pv - pv_to_house, 0.0f);
          float pv_to_batt = fminf(pv_remaining, batt_chg);
          float batt_chg_remaining = fmaxf(batt_chg - pv_to_batt, 0.0f);

          float grid_to_batt = fminf(grid_import_remaining, batt_chg_remaining);

          // Export leftovers: PV first, then battery.
          float pv_after_batt = fmaxf(pv_remaining - pv_to_batt, 0.0f);
          float pv_to_grid = fminf(pv_after_batt, grid_export);
          float grid_export_remaining = fmaxf(grid_export - pv_to_grid, 0.0f);

          float batt_after_house = fmaxf(batt_dis - batt_to_house, 0.0f);
          float batt_to_grid = fminf(batt_after_house, grid_export_remaining);

          id(flow_pv_house) = pv_to_house;
          id(flow_pv_battery) = pv_to_batt;
          id(flow_pv_grid) = pv_to_grid;
          id(flow_batt_house) = batt_to_house;
          id(flow_batt_grid) = batt_to_grid;
          id(flow_grid_house) = grid_to_house;
          id(flow_grid_battery) = grid_to_batt;
      - lvgl.obj.update:
          id: dot_pv_house
          hidden: !lambda "return id(flow_pv_house) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            if (id(ha_inverter_total_active_power).state < 0) t = 1.0f - t;
            float d = t * 46.0f;
            float x;
            if (d < 20.0f) {
              x = 128.0f;
            } else {
              x = 128.0f + (d - 20.0f);
            }
            return (int)(x - 3.0f);
          y: !lambda |-
            float t = id(flow_phase);
            if (id(ha_inverter_total_active_power).state < 0) t = 1.0f - t;
            float d = t * 46.0f;
            float y;
            if (d < 20.0f) {
              y = 92.0f + d;
            } else {
              y = 112.0f;
            }
            return (int)(y - 3.0f);
      - lvgl.obj.update:
          id: dot_pv_battery
          hidden: !lambda "return id(flow_pv_battery) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            return (int)(120.0f - 3.0f);
          y: !lambda |-
            float t = id(flow_phase);
            float y = 76.0f + t * 86.0f;
            return (int)(y - 3.0f);
      - lvgl.obj.update:
          id: dot_pv_grid
          hidden: !lambda "return id(flow_pv_grid) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            float d = t * 46.0f;
            float x;
            if (d < 20.0f) {
              x = 112.0f;
            } else {
              x = 112.0f - (d - 20.0f);
            }
            return (int)(x - 3.0f);
          y: !lambda |-
            float t = id(flow_phase);
            float d = t * 46.0f;
            float y;
            if (d < 20.0f) {
              y = 92.0f + d;
            } else {
              y = 112.0f;
            }
            return (int)(y - 3.0f);
      - lvgl.obj.update:
          id: dot_batt_house
          hidden: !lambda "return id(flow_batt_house) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            float d = t * 44.0f;
            float x;
            if (d < 18.0f) {
              x = 128.0f;
            } else {
              x = 128.0f + (d - 18.0f);
            }
            return (int)(x - 3.0f);
          y: !lambda |-
            float t = id(flow_phase);
            float d = t * 44.0f;
            float y;
            if (d < 18.0f) {
              y = 146.0f - d;
            } else {
              y = 128.0f;
            }
            return (int)(y - 3.0f);
      - lvgl.obj.update:
          id: dot_batt_grid
          hidden: !lambda "return id(flow_batt_grid) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            float d = t * 44.0f;
            float x;
            if (d < 18.0f) {
              x = 112.0f;
            } else {
              x = 112.0f - (d - 18.0f);
            }
            return (int)(x - 3.0f);
          y: !lambda |-
            float t = id(flow_phase);
            float d = t * 44.0f;
            float y;
            if (d < 18.0f) {
              y = 146.0f - d;
            } else {
              y = 128.0f;
            }
            return (int)(y - 3.0f);
      - lvgl.obj.update:
          id: dot_grid_house
          hidden: !lambda "return id(flow_grid_house) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            float x = 86.0f + t * 68.0f;
            return (int)(x - 3.0f);
          y: !lambda |-
            return (int)(120.0f - 3.0f);
      - lvgl.obj.update:
          id: dot_grid_battery
          hidden: !lambda "return id(flow_grid_battery) < 10.0f;"
          x: !lambda |-
            float t = id(flow_phase);
            float d = t * 44.0f;
            float x;
            if (d < 26.0f) {
              x = 86.0f + d;
            } else {
              x = 112.0f;
            }
            return (int)(x - 3.0f);
          y: !lambda |-
            float t = id(flow_phase);
            float d = t * 44.0f;
            float y;
            if (d < 26.0f) {
              y = 128.0f;
            } else {
              y = 128.0f + (d - 26.0f);
            }
            return (int)(y - 3.0f);

