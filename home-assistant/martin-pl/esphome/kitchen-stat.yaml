lvgl:
    bg_color: 0
    border_width: 0
    outline_width: 0
    #shadow_width: 0
    text_font: unscii_16
    align: center
    style_definitions:
      - id: font_style
        text_font: MONTSERRAT_16
        #text_font: unscii_16
        align: center
        text_color: 0xFFFFFF
        #bg_opa: cover
        bg_opa: TRANSP
        bg_color: 0
        radius: 4
        pad_all: 2 
      - id: power_style
        text_font: MONTSERRAT_26
        align: center
        text_color: 0xFFFFFF
        bg_opa: TRANSP
        bg_color: 0
        radius: 4
        pad_all: 0
      - id: unit_style
        text_font: MONTSERRAT_12
        align: center
        text_color: 0xFFFFFF
        bg_opa: TRANSP
        bg_color: 0
        radius: 4
        translate_y: 4
        pad_all: 0
      - id: details_style
        text_font: MONTSERRAT_16
        align: center
        text_color: 0xFFFFFF
        #bg_opa: cover
        bg_opa: TRANSP
        bg_color: 0
        radius: 4
        pad_all: 2 
    page_wrap: true
    pages:
      - id: main_page
        widgets:
          - obj: # Round canvas
              height: 240 # needed to be explicitily defined for my round display to not have weird border line overlapping
              width: 240
              align: center
              bg_color: 0
              border_width: 0
              outline_width: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              clip_corner: true
              radius: 120
              widgets:
                - line: # PV center (vertical to battery)
                    id: line_pv_batt
                    points:
                      - 120,76
                      - 120,162
                    line_width: 2
                    line_color: 0xffc400
                - line: # PV left stub
                    id: line_pv_stub_left
                    points:
                      - 112,76
                      - 112,92
                    line_width: 2
                    line_color: 0xffc400
                - line: # PV right stub
                    id: line_pv_stub_right
                    points:
                      - 128,76
                      - 128,92
                    line_width: 2
                    line_color: 0xffc400
                - line: # PV -> Grid (right angle)
                    id: line_pv_grid
                    points:
                      - 112,92
                      - 112,112
                      - 86,112
                    line_width: 2
                    line_color: 0xffc400
                - line: # PV -> Load (right angle)
                    id: line_pv_house
                    points:
                      - 128,92
                      - 128,112
                      - 154,112
                    line_width: 2
                    line_color: 0xffc400
                - line: # Battery left stub
                    id: line_batt_stub_left
                    points:
                      - 112,162
                      - 112,146
                    line_width: 2
                    line_color: 0xff80ab
                - line: # Battery right stub
                    id: line_batt_stub_right
                    points:
                      - 128,162
                      - 128,146
                    line_width: 2
                    line_color: 0xff80ab
                - line: # Battery -> Grid (right angle)
                    id: line_batt_grid
                    points:
                      - 112,146
                      - 112,128
                      - 86,128
                    line_width: 2
                    line_color: 0xff80ab
                - line: # Battery -> Load (right angle)
                    id: line_batt_house
                    points:
                      - 128,146
                      - 128,128
                      - 154,128
                    line_width: 2
                    line_color: 0xff80ab
                - line: # Grid -> Load (straight)
