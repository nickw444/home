id: "1756440123456"
alias: "kitchen ambiance: brighten on motion when downlights off"
description: ""
trigger:
  - platform: state
    entity_id: binary_sensor.kitchen_motion_occupancy
    from: "off"
    to: "on"
condition:
  - condition: sun
    after: sunset
  - condition: time
    before: "23:00:00"
  - condition: not
    conditions:
      - condition: state
        entity_id: light.kitchen
        state: "on"
  - condition: state
    entity_id: light.kitchen_strip
    state: "on"
  - condition: state
    entity_id: light.bench_strip
    state: "on"
  - condition: state
    entity_id: input_boolean.guest_mode
    state: "off"
  - condition: state
    entity_id: group.all_people
    state: home
  - condition: template
    value_template: >
      {{ states('vacuum.crystal') not in ['cleaning', 'returning'] }}
action:
  # We must pre-set brightness with a separate call, then turn the light
  # on due to SetOption20
  - service: light.turn_on
    data:
      brightness_pct: 50
    target:
      entity_id:
        - light.kitchen_strip
        - light.bench_strip
  - service: light.turn_on
    data:
      transition: 5
    target:
      entity_id:
        - light.kitchen_strip
        - light.bench_strip
  - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.kitchen_motion_occupancy
        from: "on"
        to: "off"
        for: 00:03:00
      - platform: state
        entity_id: light.kitchen
        from: "off"
        to: "on"
      - platform: state
        entity_id: light.kitchen_strip
        from: "on"
        to: "off"
      - platform: state
        entity_id: light.bench_strip
        from: "on"
        to: "off"
  - choose:
      - conditions:
          - condition: state
            entity_id: light.kitchen
            state: "on"
        sequence: []
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: light.kitchen_strip
                state: "off"
              - condition: state
                entity_id: light.bench_strip
                state: "off"
        sequence: []
    default:
      - service: light.turn_on
        data:
          brightness_pct: 10
          transition: 5
        target:
          entity_id:
            - light.kitchen_strip
            - light.bench_strip
mode: restart
